name: firebase_ai
description: Firebase AI Logic SDK.
version: 4.0.0
publish_to: none

homepage: https://firebase.google.com/docs/vertex-ai/get-started?platform=flutter
topics:
  - firebase
  - generative-ai
  - gemini
  - imagen

# Explicit about the supported platforms.
platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: '^3.12.0'
  flutter: ">=3.44.0"

dependencies:
  firebase_app_check: 
    git: https://github.com/kumsumit/firebase_app_check.git
  firebase_auth: 
    git: https://github.com/kumsumit/firebase_auth.git
  firebase_core: 
    git: https://github.com/kumsumit/firebase_core.git
  firebase_core_platform_interface: 
    git: https://github.com/kumsumit/firebase_core_platform_interface.git
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.19.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  matcher: ^0.12.20
  mockito: ^5.8.1
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.ai
        pluginClass: FirebaseAIPlugin
      ios:
        pluginClass: FirebaseAIPlugin
      macos:
        pluginClass: FirebaseAIPlugin
