name: firebase_ai_example
description: "Example project to show how to use the Firebase AI SDK."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1


environment:
  sdk: '^3.12.0'
  flutter: '>=3.44.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  camera: 
    git: https://github.com/kumsumit/camera.git
  cupertino_icons: ^1.0.6
  firebase_ai: 
    git: https://github.com/kumsumit/firebase_ai.git
  firebase_core: 
    git: https://github.com/kumsumit/firebase_core.git
  firebase_storage: 
    git: https://github.com/kumsumit/firebase_storage.git
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_markdown_plus: ^1.0.12
  flutter_soloud: ^4.1.7
  image: 
    git: https://github.com/kumsumit/image.git
  image_picker: 
    git: https://github.com/kumsumit/image_picker.git
  path_provider: 
    git: https://github.com/kumsumit/path_provider.git
  record: ^7.1.1
  waveform_flutter: ^1.2.0

dev_dependencies:
  # `firebase_ai_mock_test.dart` installs a mock platform via
  # `firebase_core_platform_interface/test.dart`, which firebase_core does not
  # re-export.
  firebase_core_platform_interface:
    git: https://github.com/kumsumit/firebase_core_platform_interface.git
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # `firebase_ai_response_parsing_e2e_test.dart` fetches the reference response
  # fixtures straight over HTTP.
  http: ^1.6.0
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

dependency_overrides:
  path_provider:
    git: https://github.com/kumsumit/path_provider.git
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git



flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/documents/
    - assets/videos/
